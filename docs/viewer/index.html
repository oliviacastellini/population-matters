<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Descifrando el lupus — visor</title><style>
:root{--ink:#303B38;--green:#376b60;--cream:#F8F7F2;--border:#E6E8E5}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}.reader{max-width:860px;margin:auto;padding:20px 18px 14px}.stage{min-height:380px;display:flex;align-items:center;justify-content:center;background:#eeeae7;border-radius:12px;padding:18px}.stage img{display:block;max-height:690px;max-width:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 8px 24px #25252524;background:white}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}.nav{display:flex;align-items:center;gap:14px}.btn{border:1px solid var(--border);background:white;color:var(--green);padding:10px 14px;border-radius:100px;font-size:14px;cursor:pointer}.btn:hover{background:#eaf4ef}.btn:disabled{opacity:.3;cursor:default}.count{font-size:14px;font-variant-numeric:tabular-nums}.pdf{color:var(--green);font-size:14px;text-decoration:underline;text-underline-offset:3px}.hint{font-size:12px;color:#53625B;margin-top:12px}@media(max-width:600px){.reader{padding:10px}.stage{min-height:280px;padding:9px}.stage img{max-height:570px}.controls{justify-content:center}.hint{text-align:center}}
</style></head><body><main class="reader" aria-label="Folleto Descifrando el lupus"><div class="stage"><img id="page" src="pages/page-01.png" alt="Página 1 del folleto Descifrando el lupus"></div><div class="controls"><div class="nav"><button class="btn" id="prev" aria-label="Página anterior">← Anterior</button><span class="count" id="count" aria-live="polite">1 / 20</span><button class="btn" id="next" aria-label="Página siguiente">Siguiente →</button></div><a class="pdf" href="booklet.pdf" target="_blank" rel="noopener">Abrir PDF original ↗</a></div><div class="hint">Usa las flechas del teclado para pasar de página.</div></main><script>
const total=20;let current=1;const img=document.getElementById('page'),count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next');function show(n){current=Math.max(1,Math.min(total,n));img.src=`pages/page-${String(current).padStart(2,'0')}.png`;img.alt=`Página ${current} de ${total} del folleto Descifrando el lupus`;count.textContent=`${current} / ${total}`;prev.disabled=current===1;next.disabled=current===total;}prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});show(1);
</script></body></html>
